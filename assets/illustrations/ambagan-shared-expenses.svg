<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 640 640" fill="none" role="img" aria-labelledby="title description">
  <title id="title">A little shared, a little your own</title>
  <desc id="description">Three friends connected to a shared peso receipt, two settled shares, and a personal expense notebook. An asymmetrical cut-paper illustration on a transparent canvas.</desc>

  <!-- Loose connections follow the receipt entries, rather than an orbit. -->
  <g stroke="#7C3AED" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="2 11">
    <path d="M176 218C181 261 204 281 250 286"/>
    <path d="M461 276C446 279 446 318 413 326"/>
    <path d="M184 420C224 434 204 374 253 367"/>
  </g>

  <!-- A private notebook, tucked beneath the shared receipt. -->
  <g transform="rotate(12 434 451)" stroke-linejoin="round">
    <path d="M379 381L481 378Q493 379 493 392L496 511Q496 522 484 524L384 527Q374 526 374 515L372 395Q372 384 379 381Z" fill="#7C3AED" stroke="#2E1065" stroke-width="4"/>
