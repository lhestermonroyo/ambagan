    <!-- Outlined peso mark: no font dependency, and no other lettering. -->
    <g stroke="#7C3AED" stroke-width="7" stroke-linecap="round">
      <path d="M271 240L271 185L289 185C325 185 325 221 290 221L272 221"/>
      <path d="M260 198L320 198M260 208L320 208"/>
    </g>
    <path d="M342 205L366 205M342 221L356 221" stroke="#DDD6FE" stroke-width="6" stroke-linecap="round"/>
    <path d="M250 260L382 262" stroke="#2E1065" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 7"/>

