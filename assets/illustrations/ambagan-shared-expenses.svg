    <path d="M250 414L381 416" stroke="#2E1065" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 7"/>
    <path d="M264 435L316 436M351 435L371 435" stroke="#7C3AED" stroke-width="6" stroke-linecap="round"/>
  </g>

